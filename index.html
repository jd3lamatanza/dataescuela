<!doctype html>
<html lang="es" class="h-full bg-white">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0758b3" />
    <script>
      try {
        if (localStorage.getItem('dw-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {
        console.warn('No se pudo leer la preferencia de apariencia.')
      }
    </script>
    <link rel="icon" href="./favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
    <link rel="manifest" href="./manifest.webmanifest?v=2" />
    <style>
      .app-splash { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; background: #fff; color: #0f172a; font-family: system-ui, sans-serif; text-align: center; }
      .app-splash img { width: min(192px, 60vw); height: auto; }
      .app-splash-title { margin: 1.25rem 0 0; font-size: 1.5rem; font-weight: 700; }
      .app-splash-message { margin: .5rem 0 0; color: #64748b; font-size: .875rem; }
      .dark .app-splash { background: #172235; color: #f1f5f9; }
      .dark .app-splash-message { color: #cbd5e1; }
    </style>
    <title>DataEscuela v2</title>
  </head>
  <body class="h-full font-sans text-slate-900 antialiased">
    <div id="app" class="h-full"><div class="app-splash" role="status" aria-label="Cargando DataEscuela">
      <img src="./icon-512.png?v=2" width="192" height="192" alt="" />
      <p class="app-splash-title">DataEscuela</p><p class="app-splash-message">Cargando la aplicación…</p>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
